[platformio]
default_envs = waveshare-esp32-s3-touch-lcd-7

[env:waveshare-esp32-s3-touch-lcd-7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Original Waveshare ESP32-S3-Touch-LCD-7 (not 7B/7C):
; ESP32-S3, 800x480 ST7262, GT911, CH422G, 8 MB flash, 8 MB OPI PSRAM.
; ESP32_Display_Panel 0.1.4 requires Arduino-ESP32 3.x.
; pioarduino 51.03.07 provides Arduino-ESP32 3.0.7 / ESP-IDF 5.1.4.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/patch_display_driver.py

; Compile the application entry point only. hardware_test.cpp has its own setup()/loop()
; and is selected exclusively by the waveshare-display-test environment below.
build_src_filter = +<*> -<hardware_test.cpp>

lib_ldf_mode = deep
lib_compat_mode = soft

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DCORE_DEBUG_LEVEL=1
  -I include

lib_deps =
  iamfaraz/Waveshare_ST7262_LVGL@0.1.0
  lvgl/lvgl@8.3.11
  bitbank2/PNGdec@1.1.3
  bblanchon/ArduinoJson@6.21.5
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v0.1.4
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v0.0.3

; Optional first upload: verifies LCD, PSRAM and capacitive touch without Wi-Fi.
[env:waveshare-display-test]
extends = env:waveshare-esp32-s3-touch-lcd-7
build_src_filter = -<*> +<hardware_test.cpp>
